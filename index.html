<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Escáner Automático | Óptica Mibec</title>
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#101827">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
      text-align: center;
      padding: 15px;
    }
    h2 { color: #38bdf8; }
    video {
      width: 100%;
      max-width: 600px;
      border: 3px solid #38bdf8;
      border-radius: 12px;
    }
    button {
      background: #16a34a;
      color: white;
      border: 0;
      padding: 15px;
      margin: 10px;
      border-radius: 10px;
      font-size: 18px;
    }
    #mensaje { font-size: 18px; }
  </style>
</head>
<body>

<h2>📷 ÓPTICA MIBEC</h2>
<h3>ESCÁNER AUTOMÁTICO</h3>

<video id="video" autoplay playsinline muted></video>

<p id="mensaje">Cámara desactivada</p>

<button onclick="iniciar()">📷 ACTIVAR ESCÁNER</button>
<button onclick="detener()">DETENER</button>

<h3>Último código: <span id="codigo">---</span></h3>
<h3>Lecturas: <span id="total">0</span></h3>
<h3>🔢 CONTEO POR CANTIDAD</h3>

<input
  type="number"
  id="cantidadManual"
  min="1"
  value="1"
  style="font-size:20px; width:100px; padding:10px;"
>

<br>

<button type="button" onclick="agregarCantidadManual()">
  ➕ AGREGAR CANTIDAD
</button>

<p id="mensajeCantidad"></p>
<script>
let stream = null;
let detector = null;
let activo = false;
let ultimoCodigo = "";
let codigoVisible = "";
let lecturasSinCodigo = 0;
let ultimaLectura = 0;
let total = 0;
let conteoPorProducto = JSON.parse(
  localStorage.getItem("mibec_conteo_prueba") || "{}"
);

function guardarConteoLocal() {
  localStorage.setItem(
    "mibec_conteo_prueba",
    JSON.stringify(conteoPorProducto)
  );
}
 function recuperarConteoLocal() {
  total = Object.values(conteoPorProducto).reduce(
    (suma, cantidad) => suma + Number(cantidad),
    0
  );

  document.getElementById("total").textContent = total;
}

recuperarConteoLocal();
async function iniciar() {
  try {
    if (!("BarcodeDetector" in window)) {
      document.getElementById("mensaje").textContent =
        "Este navegador no admite el detector de códigos.";
      return;
    }

    detector = new BarcodeDetector({
      formats: ["code_128", "code_39", "ean_13", "ean_8"]
    });

    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" },
      audio: false
    });

    const video = document.getElementById("video");
    video.srcObject = stream;
    await video.play();

    activo = true;
    document.getElementById("mensaje").textContent =
      "Escáner activo. Apunta al código de barras.";

    escanear();
  } catch (error) {
    document.getElementById("mensaje").textContent =
      "No se pudo activar la cámara: " + error.message;
  }
}

async function escanear() {
  if (!activo) return;

  try {
    const codigos = await detector.detect(
      document.getElementById("video")
    );
if (codigos.length === 0) {
  lecturasSinCodigo++;

  if (lecturasSinCodigo >= 10) {
    codigoVisible = "";
  }
} else {
  lecturasSinCodigo = 0;
}
    if (codigos.length > 0) {
      const codigo = codigos[0].rawValue;
      const ahora = Date.now();

      // Evita contar repetidamente el mismo código
      // mientras permanece frente a la cámara.
     if (codigo !== codigoVisible) {
  codigoVisible = codigo;
  lecturasSinCodigo = 0;
        ultimoCodigo = codigo;
        ultimaLectura = ahora;
        total++;
conteoPorProducto[codigo] =
  (conteoPorProducto[codigo] || 0) + 1;

guardarConteoLocal();
        document.getElementById("codigo").textContent = codigo;
        document.getElementById("total").textContent = total;
        document.getElementById("mensaje").textContent =
          "Código detectado correctamente";
      }
    }
  } catch (error) {
    document.getElementById("mensaje").textContent =
      "Error al leer: " + error.message;
  }

  if (activo) setTimeout(escanear, 300);
}
function agregarCantidadManual() {
  const codigo = document.getElementById("codigo").textContent.trim();

  const cantidad = Number(
    document.getElementById("cantidadManual").value
  );

  const mensaje = document.getElementById("mensajeCantidad");

  if (!codigo || codigo === "---") {
    mensaje.textContent = "⚠️ Primero escanea un código de barras.";
    return;
  }

  if (!Number.isSafeInteger(cantidad) || cantidad < 1) {
    mensaje.textContent = "⚠️ Introduce una cantidad válida.";
    return;
  }

  total += cantidad;
conteoPorProducto[codigo] =
  (conteoPorProducto[codigo] || 0) + cantidad;

guardarConteoLocal();
  document.getElementById("total").textContent = total;

  mensaje.textContent =
    "✅ Se agregaron " + cantidad +
    " unidades al código " + codigo;
}
function detener() {
  activo = false;

  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }

  document.getElementById("mensaje").textContent =
    "Escáner detenido";
}
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./sw.js")
      .then(function () {
        console.log("Escáner Mibec preparado para uso sin conexión");
      })
      .catch(function (error) {
        console.error("Error al activar modo sin conexión:", error);
      });
  });
}
</script>
</body>
</html>
